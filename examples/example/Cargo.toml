[package]
name = "example" # Shorter and simpler name used for shorter module in terminal captures.
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Off-thread logging example"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
polog = { workspace = true, default-features = false, features = [ "std" ] }
polog-util = { workspace = true, default-features = false, features = [ "std", "offloader", "shared-filter" ] }
pologger = { workspace = true, default-features = false, features = [ "log-0-4", "slog-2", "tracing-0-1" ] }
log = { version = "0.4.35", default-features = false }
slog = {  version = "2.8.2", default-features = false }
tracing = { version = "0.1.44", default-features = false }
parking_lot = { version = "0.13.0", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = [ "rt", "rt-multi-thread", "time" ] }

[badges.maintenance]
status = "passively-maintained"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
