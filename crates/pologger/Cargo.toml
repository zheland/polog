[package]
name = "pologger"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Performance-oriented structured logging facade backend"
documentation = "https://docs.rs/pologger"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = [
    "log",
    "logging",
    "structured-logging",
    "tracing",
    "profiling",
]
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
]

[features]
log-0-4 = [ "dep:log-0-4", "log-0-4/alloc", "log-0-4/kv", "polog-util/log-0-4", "polog-util/shared-filter" ]
slog-2 = [ "dep:slog-2", "polog-util/slog-2" ]
tracing-0-1 = [ "dep:tracing-core-0-1", "dep:tracing-0-1", "tracing-core-0-1/std", "polog-util/tracing-core-0-1", "polog-util/shared-filter", "dep:dashmap" ]

[dependencies]
bitflags = { version = "2.13.2", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = [ "clock" ] }
dashmap = { version = "6.2.1", default-features = false, optional = true }
humantime = { version = "2.4.0", default-features = false }
log-0-4 = { package = "log", version = "0.4.35", default-features = false, optional = true }
# Bumping `parking_lot` requires a `pologger` breaking-change release,
# because the version of `parking_lot` is a part of `pologger`'s public type identity.
parking_lot = { version = "0.13.0", default-features = false }
polog = { workspace = true, default-features = false }
polog-util = { workspace = true, default-features = false, features = [ "alloc", "offloader", "shared-filter" ] }
slog-2 = { package = "slog", version = "2.8.2", default-features = false, optional = true }
supports-color = { version = "3.0.2", default-features = false }
tracing-0-1 = { package = "tracing", version = "0.1.44", default-features = false, optional = true }
tracing-core-0-1 = { package = "tracing-core", version = "0.1.36", default-features = false, optional = true }

[dev-dependencies]
polog-util = { workspace = true, default-features = false, features = [ "shared", "offloader" ] }
pretty_assertions = "1.4.1"

[badges.maintenance]
status = "passively-maintained"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
