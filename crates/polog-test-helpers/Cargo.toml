[package]
name = "polog-test-helpers"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Polog test helper utilities"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
polog = { workspace = true, default-features = false, features = [ "alloc" ] }
